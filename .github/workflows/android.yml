name: APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      PESO_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Los tests primero: si el parser se rompe, no sale APK.
      - name: Tests
        working-directory: android
        run: gradle test --no-daemon --stacktrace

      # Si algo falla, el detalle tiene que quedar visible en el log, no solo
      # en un artefacto que hay que descargar.
      - name: Detalle del fallo
        if: failure()
        working-directory: android
        run: |
          echo "=============== RESUMEN DE TESTS ==============="
          find . -name "*.xml" -path "*test-results*" -print -exec cat {} \; || true
          echo "=============== INFORMES HTML =================="
          find . -path "*reports/tests*" -name "*.html" -print || true

      # Sin el secreto el APK sale igual, pero con llave de un solo uso: no
      # se podra instalar encima de la version anterior.
      - name: Llave de firma
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/peso.p12"
          echo "PESO_KEYSTORE=$RUNNER_TEMP/peso.p12" >> "$GITHUB_ENV"

      - name: Ensamblar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: peso-total-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
